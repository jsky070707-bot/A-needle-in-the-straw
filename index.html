<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>藁の山と一本の針</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #1e1e1e;
    overflow: hidden;
    overscroll-behavior: none;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }
  canvas {
    width: 100vw;
    height: calc(100vw * 600 / 900);
    max-height: 100vh;
    max-width: calc(100vh * 900 / 600);
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    background: #f0ebd7;
  }
</style>
</head>
<body>
<canvas id="game" width="900" height="600"></canvas>

<script>
(() => {
  "use strict";

  // ==========================================
  // 藁の山と一本の針 v8.2 (Web版)
  // 100万本固定
  // ==========================================

  const W = 900, H = 600;
  const TOTAL_HAY = 1000000;
  const DISPLAY_MAX = 3000;
  const SAVE_KEY = "straw_needle_million";

  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");

  const FONT = '"Noto Sans JP","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",sans-serif';
  const font = (px) => `${px}px ${FONT}`;

  const WHITE = "#fff";
  const BLACK = "#1e1e1e";
  const LIGHT = "#f0ebd7";
  const GOLD = "#e6b428";
  const GREEN = "#469650";
  const RED = "#c84646";
  const BROWN = "#96642d";

  const PILE_RECT = { x: 25, y: 65, w: 635, h: 390 };
  const SALE_RECT = { x: 690, y: 350, w: 180, h: 100 };
  const RESTART_RECT = { x: 340, y: 365, w: 220, h: 45 };
  const BUTTONS = [
    { x: 15, y: 500, w: 210, h: 80 },
    { x: 235, y: 500, w: 210, h: 80 },
    { x: 455, y: 500, w: 210, h: 80 },
    { x: 675, y: 500, w: 210, h: 80 },
  ];

  const inRect = (r, x, y) => x >= r.x && x < r.x + r.w && y >= r.y && y < r.y + r.h;

  // ==========================================
  // ゲームデータ
  // ==========================================

  let remainingHay = TOTAL_HAY;
  let money = 0;
  let priceLevel = 1;
  let capacityLevel = 1;
  let autoUnlocked = false;
  let autoSpeedLevel = 1;

  let hay = [];
  let needleFound = false;
  let dragged = null;

  let autoTimer = 0;
  let saveTimer = 0;
  let message = "藁をドラッグして売却しよう！";
  let gameLog = [];

  // ==========================================
  // 藁の生成
  // ==========================================

  const COLORS = [
    [190, 145, 65], [205, 165, 85], [220, 185, 105], [175, 125, 55], [230, 195, 125],
    [195, 155, 80], [165, 120, 60], [215, 175, 95], [185, 150, 85], [225, 190, 115],
  ];
  const THICKNESS = [1, 1, 2, 2, 3];

  const randInt = (a, b) => Math.floor(Math.random() * (b - a + 1)) + a;
  const choice = (arr) => arr[Math.floor(Math.random() * arr.length)];

  function createHay() {
    const length = randInt(18, 48);
    const angle = Math.random() * Math.PI * 2;
    const c = choice(COLORS);
    return {
      x: randInt(45, 635),
      y: randInt(85, 435),
      dx: Math.cos(angle) * length / 2,
      dy: Math.sin(angle) * length / 2,
      thickness: choice(THICKNESS),
      color: `rgb(${c[0]},${c[1]},${c[2]})`,
      highlight: `rgb(${Math.min(255, c[0] + 15)},${Math.min(255, c[1] + 12)},${Math.min(255, c[2] + 8)})`,
    };
  }

  function replenishHay() {
    const target = Math.min(DISPLAY_MAX, remainingHay);
    while (hay.length < target) hay.push(createHay());
  }

  // ==========================================
  // セーブ / ロード
  // ==========================================

  function saveGame() {
    const data = {
      total: TOTAL_HAY,
      remaining: remainingHay,
      money,
      price_level: priceLevel,
      capacity_level: capacityLevel,
      auto_unlocked: autoUnlocked,
      auto_speed_level: autoSpeedLevel,
      needle_found: needleFound,
      game_log: gameLog,
    };
    try {
      localStorage.setItem(SAVE_KEY, JSON.stringify(data));
    } catch (e) {
      console.warn("セーブエラー:", e);
    }
  }

  function newGame() {
    remainingHay = TOTAL_HAY;
    money = 0;
    priceLevel = 1;
    capacityLevel = 1;
    autoUnlocked = false;
    autoSpeedLevel = 1;
    hay = [];
    needleFound = false;
    dragged = null;
    autoTimer = 0;
    gameLog = [];
    message = "100万本モード開始！";
    replenishHay();
    saveGame();
  }

  function loadGame() {
    let raw = null;
    try { raw = localStorage.getItem(SAVE_KEY); } catch (e) { /* ignore */ }
    if (!raw) { newGame(); return; }

    try {
      const d = JSON.parse(raw);
      const num = (v, def) => {
        const n = Math.floor(Number(v));
        return Number.isFinite(n) ? n : def;
      };
      remainingHay = Math.max(0, Math.min(TOTAL_HAY, num(d.remaining, TOTAL_HAY)));
      money = Math.max(0, num(d.money, 0));
      priceLevel = Math.max(1, num(d.price_level, 1));
      capacityLevel = Math.max(1, num(d.capacity_level, 1));
      autoUnlocked = !!d.auto_unlocked;
      autoSpeedLevel = Math.max(1, num(d.auto_speed_level, 1));
      needleFound = !!d.needle_found;
      gameLog = Array.isArray(d.game_log) ? d.game_log : [];
      if (remainingHay === 0) needleFound = true;
      hay = [];
      replenishHay();
      message = "セーブデータを読み込んだ！";
    } catch (e) {
      console.warn("ロードエラー:", e);
      newGame();
    }
  }

  // ==========================================
  // 強化価格
  // ==========================================

  const priceUpgradeCost = () => 500 * Math.pow(2, priceLevel - 1);
  const capacityUpgradeCost = () => 750 * Math.pow(2, capacityLevel - 1);
  const autoUnlockCost = () => 1500;
  const autoSpeedCost = () => 600 * Math.pow(2, autoSpeedLevel - 1);
  const salePrice = () => 10 * priceLevel;
  const carryCapacity = () => capacityLevel;

  const fmt = (n) => Math.floor(n).toLocaleString("ja-JP");

  // ==========================================
  // ログ
  // ==========================================

  function addLog(text) {
    gameLog.push(text);
    gameLog = gameLog.slice(-10);
  }

  // ==========================================
  // 売却
  // ==========================================

  function sellHay(selected) {
    if (remainingHay <= 0) return;

    const amount = Math.min(carryCapacity(), remainingHay, hay.length);
    const idx = selected ? hay.indexOf(selected) : -1;
    let removed = 0;

    // ドラッグした藁を先に1本売却
    if (idx >= 0) {
      hay.splice(idx, 1);
      removed = 1;
    }

    // 残りの本数ぶんをランダムに売却
    while (removed < amount && hay.length) {
      hay.splice(Math.floor(Math.random() * hay.length), 1);
      removed++;
    }

    const earned = amount * salePrice();
    money += earned;
    remainingHay -= amount;
    message = `${fmt(amount)}本売却！ +${fmt(earned)}円`;

    if (remainingHay <= 0) {
      remainingHay = 0;
      needleFound = true;
      hay = [];
      message = "針を見つけた！クリア！";
      addLog("針を見つけた！");
      addLog("藁の山をすべて売却した！");
    } else {
      replenishHay();
    }
    saveGame();
  }

  // ==========================================
  // ロボット
  // ==========================================

  function robotUpdate(dt) {
    if (!autoUnlocked || needleFound) return;

    const interval = Math.max(0.08, 2.0 / Math.pow(autoSpeedLevel, 0.7));
    autoTimer += dt;

    let guard = 0;
    while (autoTimer >= interval && guard++ < 1000) {
      autoTimer -= interval;
      if (remainingHay > 0 && hay.length) sellHay();
      if (needleFound) break;
    }
  }

  // ==========================================
  // 強化購入
  // ==========================================

  function buyUpgrade(index) {
    if (needleFound) return;

    if (index === 0) {
      const cost = priceUpgradeCost();
      if (money >= cost) { money -= cost; priceLevel++; message = "売却価格を強化した！"; }
      else message = "お金が足りない！";
    } else if (index === 1) {
      const cost = capacityUpgradeCost();
      if (money >= cost) { money -= cost; capacityLevel++; message = "持てる本数を強化した！"; }
      else message = "お金が足りない！";
    } else if (index === 2) {
      if (!autoUnlocked) {
        const cost = autoUnlockCost();
        if (money >= cost) { money -= cost; autoUnlocked = true; message = "ロボットを購入した！"; }
        else message = "お金が足りない！";
      } else {
        message = "ロボットは購入済み！";
      }
    } else if (index === 3) {
      if (!autoUnlocked) { message = "先にロボットを購入しよう！"; return; }
      if (autoSpeedLevel >= 20) { message = "ロボットは最大速度！"; return; }
      const cost = autoSpeedCost();
      if (money >= cost) { money -= cost; autoSpeedLevel++; message = "ロボットの速度を強化した！"; }
      else message = "お金が足りない！";
    }
    saveGame();
  }

  // ==========================================
  // 座標・藁選択
  // ==========================================

  function toCanvas(e) {
    const r = canvas.getBoundingClientRect();
    return {
      x: (e.clientX - r.left) * W / r.width,
      y: (e.clientY - r.top) * H / r.height,
    };
  }

  function findHay(x, y) {
    for (let i = hay.length - 1; i >= 0; i--) {
      const it = hay[i];
      const dx = it.x - x, dy = it.y - y;
      if (dx * dx + dy * dy < 32 * 32) return it;
    }
    return null;
  }

  // ==========================================
  // 操作
  // ==========================================

  function pointerDown(x, y) {
    if (needleFound) {
      if (inRect(RESTART_RECT, x, y)) newGame();
      return;
    }
    for (let i = 0; i < BUTTONS.length; i++) {
      if (inRect(BUTTONS[i], x, y)) { buyUpgrade(i); return; }
    }
    const item = findHay(x, y);
    if (item) dragged = { item, oldX: item.x, oldY: item.y };
  }

  function pointerMove(x, y) {
    if (dragged) { dragged.item.x = x; dragged.item.y = y; }
  }

  function pointerUp(x, y) {
    if (!dragged) return;
    const item = dragged.item;
    if (inRect(SALE_RECT, x, y)) {
      sellHay(item);
    } else {
      item.x = dragged.oldX;
      item.y = dragged.oldY;
    }
    dragged = null;
  }

  canvas.addEventListener("pointerdown", (e) => {
    e.preventDefault();
    try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
    const p = toCanvas(e);
    pointerDown(p.x, p.y);
  });
  canvas.addEventListener("pointermove", (e) => {
    e.preventDefault();
    const p = toCanvas(e);
    pointerMove(p.x, p.y);
  });
  canvas.addEventListener("pointerup", (e) => {
    e.preventDefault();
    const p = toCanvas(e);
    pointerUp(p.x, p.y);
  });
  canvas.addEventListener("pointercancel", () => {
    if (dragged) {
      dragged.item.x = dragged.oldX;
      dragged.item.y = dragged.oldY;
      dragged = null;
    }
  });
  canvas.addEventListener("contextmenu", (e) => e.preventDefault());

  window.addEventListener("beforeunload", saveGame);
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) saveGame();
  });

  // ==========================================
  // 描画ヘルパー
  // ==========================================

  function rr(r, radius) {
    ctx.beginPath();
    if (ctx.roundRect) {
      ctx.roundRect(r.x, r.y, r.w, r.h, radius);
    } else {
      const x = r.x, y = r.y, w = r.w, h = r.h;
      ctx.moveTo(x + radius, y);
      ctx.arcTo(x + w, y, x + w, y + h, radius);
      ctx.arcTo(x + w, y + h, x, y + h, radius);
      ctx.arcTo(x, y + h, x, y, radius);
      ctx.arcTo(x, y, x + w, y, radius);
      ctx.closePath();
    }
  }

  function fillRR(r, radius, color) {
    rr(r, radius);
    ctx.fillStyle = color;
    ctx.fill();
  }

  function strokeRR(r, radius, color, width) {
    rr(r, radius);
    ctx.strokeStyle = color;
    ctx.lineWidth = width;
    ctx.stroke();
  }

  function drawText(text, x, y, color = BLACK, px = 22, align = "left") {
    ctx.font = font(px);
    ctx.fillStyle = color;
    ctx.textAlign = align;
    ctx.textBaseline = "top";
    ctx.fillText(String(text), x, y);
  }

  function drawButton(r, title, subtitle, color) {
    fillRR(r, 10, color);
    strokeRR(r, 10, BLACK, 2);
    drawText(title, r.x + r.w / 2, r.y + 12, WHITE, 16, "center");
    drawText(subtitle, r.x + r.w / 2, r.y + 43, WHITE, 16, "center");
  }

  function drawHay() {
    ctx.lineCap = "butt";
    for (const it of hay) {
      ctx.strokeStyle = it.color;
      ctx.lineWidth = it.thickness;
      ctx.beginPath();
      ctx.moveTo(it.x - it.dx, it.y - it.dy);
      ctx.lineTo(it.x + it.dx, it.y + it.dy);
      ctx.stroke();

      ctx.strokeStyle = it.highlight;
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(it.x + it.dx * 0.65, it.y + it.dy * 0.65);
      ctx.lineTo(it.x + it.dx, it.y + it.dy);
      ctx.stroke();
    }
  }

  function drawNeedle() {
    const x = 340, y = 260;

    ctx.strokeStyle = "rgb(180,180,190)";
    ctx.lineWidth = 5;
    ctx.lineCap = "butt";
    ctx.beginPath();
    ctx.moveTo(x - 45, y + 10);
    ctx.lineTo(x + 45, y - 10);
    ctx.stroke();

    ctx.fillStyle = "rgb(210,210,220)";
    ctx.beginPath();
    ctx.moveTo(x + 45, y - 10);
    ctx.lineTo(x + 30, y - 19);
    ctx.lineTo(x + 32, y - 5);
    ctx.closePath();
    ctx.fill();

    ctx.strokeStyle = RED;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(x - 45, y + 10, 8, 0, Math.PI * 2);
    ctx.stroke();
  }

  // ==========================================
  // クリア画面
  // ==========================================

  function drawClearScreen() {
    const box = { x: 180, y: 150, w: 540, h: 270 };
    fillRR(box, 20, "rgb(255,245,190)");
    strokeRR(box, 20, GOLD, 5);

    drawText("クリア！", 365, 165, GOLD, 48);
    drawNeedle();

    fillRR({ x: 240, y: 310, w: 420, h: 45 }, 8, "rgb(255,255,230)");
    drawText("ログ：針を見つけた！", 320, 322, "rgb(120,75,20)", 22);

    fillRR(RESTART_RECT, 10, GREEN);
    strokeRR(RESTART_RECT, 10, BLACK, 2);
    drawText("もう一度最初から", 365, 377, WHITE, 16);
  }

  // ==========================================
  // ゲーム画面
  // ==========================================

  function drawGame() {
    ctx.fillStyle = LIGHT;
    ctx.fillRect(0, 0, W, H);

    drawText("藁の山と一本の針", 20, 10);
    drawText(`所持金：${fmt(money)}円`, 20, 40, "rgb(40,120,50)");
    drawText(`残り：${fmt(remainingHay)}本 / ${fmt(TOTAL_HAY)}本`, 300, 40);

    fillRR(PILE_RECT, 12, "rgb(220,210,180)");
    strokeRR(PILE_RECT, 12, BROWN, 2);

    // 山の外にはみ出さないようにクリップ
    ctx.save();
    rr(PILE_RECT, 12);
    ctx.clip();
    drawHay();
    ctx.restore();

    // ドラッグ中の藁は山の外でも見えるように再描画
    if (dragged) {
      const it = dragged.item;
      ctx.strokeStyle = it.color;
      ctx.lineWidth = it.thickness + 1;
      ctx.beginPath();
      ctx.moveTo(it.x - it.dx, it.y - it.dy);
      ctx.lineTo(it.x + it.dx, it.y + it.dy);
      ctx.stroke();
    }

    fillRR(SALE_RECT, 12, GREEN);
    strokeRR(SALE_RECT, 12, BLACK, 3);
    drawText("ここに運んで売却", SALE_RECT.x + 10, SALE_RECT.y + 25, WHITE, 16);
    drawText(`1本 ${fmt(salePrice())}円`, SALE_RECT.x + 35, SALE_RECT.y + 55, WHITE, 16);

    drawButton(BUTTONS[0], "売却価格強化", `${fmt(priceUpgradeCost())}円`, "rgb(190,130,40)");
    drawButton(BUTTONS[1], "持てる本数強化", `${fmt(capacityUpgradeCost())}円`, "rgb(70,140,180)");

    const autoText = autoUnlocked ? "購入済み" : `${fmt(autoUnlockCost())}円`;
    drawButton(BUTTONS[2], "ロボット購入", autoText, "rgb(80,150,90)");

    let speedText;
    if (!autoUnlocked) speedText = "ロボット購入後";
    else if (autoSpeedLevel >= 20) speedText = "最大レベル";
    else speedText = `${fmt(autoSpeedCost())}円`;
    drawButton(BUTTONS[3], "自動回収速度強化", speedText, "rgb(130,100,170)");

    drawText(`売却価格：${fmt(salePrice())}円`, 20, 465, BLACK, 16);
    drawText(`持てる本数：${fmt(carryCapacity())}本`, 210, 465, BLACK, 16);
    if (autoUnlocked) {
      drawText(`ロボット速度：Lv.${autoSpeedLevel}`, 430, 465, BLACK, 16);
    }

    drawText(message, 20, 567, "rgb(70,70,70)", 16);

    if (needleFound) drawClearScreen();
  }

  // ==========================================
  // メインループ
  // ==========================================

  loadGame();

  let last = performance.now();

  function loop(now) {
    const dt = Math.min(0.25, (now - last) / 1000);
    last = now;

    robotUpdate(dt);

    saveTimer += dt;
    if (saveTimer >= 10) { saveGame(); saveTimer = 0; }

    drawGame();
    requestAnimationFrame(loop);
  }

  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
